# Configurações do projeto de Previsão da Qualidade do Ar
# Este arquivo centraliza todos os parâmetros configuráveis

# Localização da coleta
location:
  latitude: -23.514561
  longitude: -46.186832
  timezone: America/Sao_Paulo

# Período de coleta (formato YYYY-MM-DD)
# Período validado nas APIs: 04/08/2022 a 31/08/2026
# Os arquivos do período são salvos com as datas no nome; os arquivos antigos de janeiro/2025 ficam preservados.
collection:
  start_date: "2022-08-04"
  end_date: "2026-08-31"

# Variáveis de qualidade do ar a coletar
air_quality_variables:
  - pm10
  - pm2_5
  - carbon_monoxide
  - nitrogen_dioxide
  - sulphur_dioxide
  - ozone

# Variáveis meteorológicas a coletar
weather_variables:
  - temperature_2m
  - relative_humidity_2m
  - precipitation
  - wind_speed_10m
  - pressure_msl

# Configurações das APIs
apis:
  air_quality:
    url: https://air-quality-api.open-meteo.com/v1/air-quality
    timeout: 30
  
  weather:
    url: https://archive-api.open-meteo.com/v1/archive
    timeout: 30

# Caminhos de dados
paths:
  raw_data: data/raw
  interim_data: data/interim
  air_quality_raw_filename: "air_quality_raw_{start_date}_{end_date}.json"
  weather_raw_filename: "weather_raw_{start_date}_{end_date}.json"
  merged_filename: "dados_merged_{start_date}_{end_date}.csv"
  labeled_filename: "dados_com_alvo_{start_date}_{end_date}.csv"

# Particionamento cronológico pelo horário previsto (time + horizonte).
# Início inclusivo e fim exclusivo para os períodos de validação e teste.
evaluation:
  target_horizon_hours: 1
  validation_folds:
    - name: "2024-Q1"
      start: "2024-01-01T00:00:00"
      end: "2024-04-01T00:00:00"
    - name: "2024-Q2"
      start: "2024-04-01T00:00:00"
      end: "2024-07-01T00:00:00"
    - name: "2024-Q3"
      start: "2024-07-01T00:00:00"
      end: "2024-10-01T00:00:00"
    - name: "2024-Q4"
      start: "2024-10-01T00:00:00"
      end: "2025-01-01T00:00:00"
  final_test:
    start: "2025-01-01T00:00:00"
    end: "2026-09-01T00:00:00"
